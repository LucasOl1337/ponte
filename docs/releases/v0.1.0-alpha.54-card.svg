y="0">NOVIDADES</tspan></text><rect x="206.04000000000002" y="249" width="30" height="24" rx="12" fill="#FFF8EC"/><text x="221.04000000000002" y="267" font-size="15" font-weight="700" fill="#B45309" text-anchor="middle" letter-spacing="0"><tspan x="221.04000000000002" dy="0">2</tspan></text><circle cx="64" cy="312" r="5" fill="#B45309"/><text x="86" y="320" font-size="24" font-weight="600" fill="#111827" text-anchor="start" letter-spacing="0"><tspan x="86" dy="0">Missões no Dev</tspan></text><text x="86" y="355" font-size="19" font-weight="400" fill="#374151" text-anchor="start" letter-spacing="0"><tspan x="86" dy="0">Máquina, harness e modelo explícitos, com rascunho e sessão para continuar depois.</tspan></text><line x1="86" y1="393" x2="1144" y2="393" stroke="#E5E7EB"/><circle cx="64" cy="409" r="5" fill="#B45309"/><text x="86" y="417" font-size="24" font-weight="600" fill="#111827" text-anchor="start" letter-spacing="0"><tspan x="86" dy="0">Atalhos do seu jeito</tspan></text><text x="86" y="452" font-size="19" font-weight="400" fill="#374151" text-anchor="start" letter-spacing="0"><tspan x="86" dy="0">Crie e edite combinações com nome próprio, sem exigir a tecla Super.</tspan></text><rect x="56" y="500" width="5" height="24" rx="2.5" fill="#15803D"/><text x="74" y="520" font-size="17" font-weight="700" fill="#15803D" text-anchor="start" letter-spacing="2"><tspan x="74" dy="0">MELHORIAS</tspan></text><rect x="206.04000000000002" y="501" width="30" height="24" rx="12" fill="#EAF7EE"/><text x="221.04000000000002" y="519" font-size="15" font-weight="700" fill="#15803D" text-anchor="middle" letter-spacing="0"><tspan x="221.04000000000002" dy="0">2</tspan></text><circle cx="64" cy="564" r="5" fill="#15803D"/><text x="86" y="572" font-size="24" font-weight="600" fill="#111827" text-anchor="start" letter-spacing="0"><tspan x="86" dy="0">Máquinas no Início</tspan></text><text x="86" y="607" font-size="19" font-weight="400" fill="#374151" text-anchor="start" letter-spacing="0"><tspan x="86" dy="0">Estado e acesso disponível na mesma lista. A Tela só muda após confirmar o destino.</tspan></text><line x1="86" y1="645" x2="1144" y2="645" stroke="#E5E7EB"/><circle cx="64" cy="661" r="5" fill="#15803D"/><text x="86" y="669" font-size="24" font-weight="600" fill="#111827" text-anchor="start" letter-spacing="0"><tspan x="86" dy="0">Monitor, janelas e sessões à vista</tspan></text><text x="86" y="704" font-size="19" font-weight="400" fill="#374151" text-anchor="start" letter-spacing="0"><tspan x="86" dy="0">Direção visual Fable em Início, Tela e Dev, com controles rotulados e listas compactas.</tspan></text><rect x="56" y="752" width="5" height="24" rx="2.5" fill="#1D4ED8"/><text x="74" y="772" font-size="17" font-weight="700" fill="#1D4ED8" text-anchor="start" letter-spacing="2"><tspan x="74" dy="0">CORREÇÕES</tspan></text><rect x="206.04000000000002" y="753" width="30" height="24" rx="12" fill="#EFF4FF"/><text x="221.04000000000002" y="771" font-size="15" font-weight="700" fill="#1D4ED8" text-anchor="middle" letter-spacing="0"><tspan x="221.04000000000002" dy="0">2</tspan></text><circle cx="64" cy="816" r="5" fill="#1D4ED8"/><text x="86" y="824" font-size="24" font-weight="600" fill="#111827" text-anchor="start" letter-spacing="0"><tspan x="86" dy="0">Preencher sem enviar</tspan></text><text x="86" y="859" font-size="19" font-weight="400" fill="#374151" text-anchor="start" letter-spacing="0"><tspan x="86" dy="0">Digite sem disparar Enter. Enviar continua sendo uma ação separada.</tspan></text><line x1="86" y1="897" x2="1144" y2="897" stroke="#E5E7EB"/><circle cx="64" cy="913" r="5" fill="#1D4ED8"/><text x="86" y="921" font-size="24" font-weight="600" fill="#111827" text-anchor="start" letter-spacing="0"><tspan x="86" dy="0">Controles que cabem em paisagem</tspan></text><text x="86" y="956" font-size="19" font-weight="400" fill="#374151" text-anchor="start" letter-spacing="0"><tspan x="86" dy="0">Coluna inteira e campo de texto visível com o teclado aberto, conferidos no POCO.</tspan></text><line x1="56" y1="1024" x2="1144" y2="1024" stroke="#E5E7EB" stroke-width="2"/><text x="56" y="1058" font-size="15" font-weight="400" fill="#6B7280" text-anchor="start" letter-spacing="0"><tspan x="56" dy="0">Notas: github.com/LucasOl1337/ponte/releases/tag/v0.1.0-alpha.54</tspan></text>
