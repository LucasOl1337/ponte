<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1206" font-family="Liberation Sans, sans-serif"><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#160D31"/><stop offset="1" stop-color="#28184D"/></linearGradient></defs><rect width="1200" height="1206" fill="url(#bg)"/><text x="56" y="90" font-size="43" fill="#F8F5FF" font-weight="700">ponte</text><text x="56" y="138" font-size="25" fill="#D8C4EA" font-weight="700">DESTAQUES DA ATUALIZAÇÃO · v0.1.0-alpha.20</text><text x="1144" y="88" text-anchor="end" font-size="18" fill="#BCB1D2">27 SET 2026</text><path d="M56 174H1144" stroke="#76638C" opacity=".5"/><rect x="56" y="202" width="6" height="28" rx="3" fill="#FFC61A"/><text x="80" y="225" font-size="26" fill="#FFC61A" font-weight="700" letter-spacing="1">NOVIDADES</text><text x="1144" y="225" text-anchor="end" font-size="20" fill="#BCB1D2">3 itens</text><text x="80" y="281" font-size="27" fill="#F8F5FF" font-weight="700">Celular no PC com o Ponte Desktop</text><text x="80" y="315" font-size="23" fill="#BCB1D2">App nativo Linux abre a tela do Android e aceita mouse e teclado.</text><text x="80" y="370" font-size="27" fill="#F8F5FF" font-weight="700">Conexão sem adivinhação</text><text x="80" y="404" font-size="23" fill="#BCB1D2">USB, depuração sem fio ou Tailscale, sempre com o serial exato.</text><text x="80" y="459" font-size="27" fill="#F8F5FF" font-weight="700">CLI JSON para agentes</text><text x="80" y="493" font-size="23" fill="#BCB1D2">ponte ctl cobre 59 comandos do servidor; desktop também responde em JSON.</text><path d="M56 548H1144" stroke="#76638C" opacity=".35"/><rect x="56" y="579" width="6" height="28" rx="3" fill="#2DD29A"/><text x="80" y="602" font-size="26" fill="#2DD29A" font-weight="700" letter-spacing="1">MELHORIAS</text><text x="1144" y="602" text-anchor="end" font-size="20" fill="#BCB1D2">2 itens</text><text x="80" y="658" font-size="27" fill="#F8F5FF" font-weight="700">Ações perigosas pedem confirmação</text><text x="80" y="692" font-size="23" fill="#BCB1D2">Desligar, reiniciar e suspender só rodam com confirmação explícita.</text><text x="80" y="747" font-size="27" fill="#F8F5FF" font-weight="700">Somente visualização e captura privada</text><text x="80" y="781" font-size="23" fill="#BCB1D2">Modo sem entrada, PNG protegido; áudio e clipboard começam desligados.</text><path d="M56 836H1144" stroke="#76638C" opacity=".35"/><rect x="56" y="867" width="6" height="28" rx="3" fill="#AA88FA"/><text x="80" y="890" font-size="26" fill="#AA88FA" font-weight="700" letter-spacing="1">SISTEMAS</text><text x="1144" y="890" text-anchor="end" font-size="20" fill="#BCB1D2">1 item</text><text x="80" y="946" font-size="27" fill="#F8F5FF" font-weight="700">Sem APK novo</text><text x="80" y="980" font-size="23" fill="#BCB1D2">Quem está no app do alpha.19 continua igual; nada pra reinstalar.</text><path d="M56 1035H1144" stroke="#76638C" opacity=".35"/><text x="56" y="1104" font-size="22" fill="#BCB1D2">Notas completas e limites de validação no GitHub Releases.</text><text x="56" y="1140" font-size="19" fill="#BCB1D2">github.com/LucasOl1337/ponte/releases</text><path d="M28 70V28H70 M1130 28H1172V70 M28 1136V1178H70 M1130 1178H1172V1136" stroke="#A593BB" fill="none" opacity=".5"/></svg>